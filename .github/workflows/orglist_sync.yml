name: Sync Orglist Dictionary

on:
  schedule:
    - cron: '0 21 * * *' # 每天台灣時間 05:00 執行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-orglist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Sync orglist dictionary
        run: python orglist/sync_orgs_and_clean.py

      - name: Commit and push orglist updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add orglist/ README.md org-search.html
          git commit -m "Automated Orglist Sync [$(date +'%Y-%m-%d')]" || exit 0
          git push
