name: Daily Agency Dictionary Sync

on:
  schedule:
    - cron: '0 16 * * *' # 每天台灣時間 00:00 執行
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Sync and Clean Agency Dictionary
        run: python orglist/sync_orgs_and_clean.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Auto-sync agency dictionary [$(date +'%Y-%m-%d')]" || exit 0
          git push
