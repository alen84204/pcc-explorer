name: Daily PCC Explorer Sync

on:
  schedule:
    - cron: '0 16 * * *' # 每天台灣時間 00:00 執行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Step 1 - Sync Agency Dictionary
        run: python orglist/sync_orgs_and_clean.py

      - name: Step 2 - Fetch Daily Tender Data
        run: python pcc_crawler.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Automated Daily Sync: Dictionary & Tenders [$(date +'%Y-%m-%d')]" || exit 0
          git push
