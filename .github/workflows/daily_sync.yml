name: Daily PCC Sync

on:
  schedule:
    - cron: '0 16 * * *' # 每天台灣時間 00:00 (UTC 16:00) 執行
  workflow_dispatch: # 支援手動觸發

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run Sync Dictionary
        run: python orglist/sync_orgs.py

      - name: Run Daily Crawler
        run: python pcc_crawler.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Auto-update tender data and agency dictionary [$(date +'%Y-%m-%d')]" || exit 0
          git push
